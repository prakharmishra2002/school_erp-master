# ═══════════════════════════════════════════════════════════════════════════════
# 🌐 School ERP - Nginx Site Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# ACCESS POINTS:
# ─────────────────────────────────────────────────────────────────────────────
#   /              → Next.js Frontend
#   /api/*         → Laravel API
#   /admin/*       → Laravel Filament Admin Panel
#   /storage/*     → Laravel Storage (uploaded files)
# ═══════════════════════════════════════════════════════════════════════════════

# Upstream servers
upstream backend {
    server backend:9000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # ═══════════════════════════════════════════════════════════════════════════
    # 🔍 Health Check Endpoint
    # ═══════════════════════════════════════════════════════════════════════════
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 📡 API Routes → Laravel Backend
    # ═══════════════════════════════════════════════════════════════════════════
    location /api {
        # Rate limiting for API
        limit_req zone=api burst=20 nodelay;
        
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 🔐 Admin Panel → Laravel Filament
    # ═══════════════════════════════════════════════════════════════════════════
    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Login rate limiting
    location /admin/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 📁 Storage Routes → Laravel Storage
    # ═══════════════════════════════════════════════════════════════════════════
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
        
        # Cache static files
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 🔧 Filament Assets
    # ═══════════════════════════════════════════════════════════════════════════
    location /filament {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 🐘 PHP Processing (Laravel)
    # ═══════════════════════════════════════════════════════════════════════════
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Timeouts for long-running requests (imports, reports)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 🖥️ Next.js Frontend (Default)
    # ═══════════════════════════════════════════════════════════════════════════
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support (for hot reload in dev)
        proxy_read_timeout 86400;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Long cache for hashed static files
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # 🚫 Security - Block sensitive files
    # ═══════════════════════════════════════════════════════════════════════════
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
